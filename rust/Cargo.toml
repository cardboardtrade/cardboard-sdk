[package]
name = "cardboard-client"
version = "0.1.0"
edition = "2021"
description = "Typed client for the public Cardboard trading API"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
httpdate = "1"
sha2 = "0.10"
